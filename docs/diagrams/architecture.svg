  <line x1="200" y1="60" x2="900" y2="60" stroke="#232428" stroke-width="1"/>

  <!-- ==================== LAYER 1: CLIENT ==================== -->
  <rect x="30" y="80" width="1040" height="130" rx="10" fill="#0f1011" stroke="#232428" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="110" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#5e6ad2" letter-spacing="1.5">CLIENT LAYER</text>

