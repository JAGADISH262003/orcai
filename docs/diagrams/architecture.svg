  <text x="210" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f7f8f8">Browser</text>
  <text x="210" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8a8f98">Next.js 15 SPA</text>

  <!-- Mobile -->
  <rect x="420" y="125" width="260" height="70" rx="8" fill="#161719" stroke="#232428" stroke-width="1"/>
  <text x="550" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f7f8f8">Mobile</text>
  <text x="550" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8a8f98">Responsive Web</text>

