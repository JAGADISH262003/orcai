services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orcai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orcai_dev_password}
      POSTGRES_DB: orcai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcai -d orcai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: ./backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &api_env
      DATABASE_URL: postgresql+psycopg://orcai:${POSTGRES_PASSWORD:-orcai_dev_password}@db:5432/orcai
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      ENV: ${ENV:-development}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      TELEGRAM_SECRET_TOKEN: ${TELEGRAM_SECRET_TOKEN:-}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: python -m app.worker
    environment: *api_env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      BACKEND_API_URL: http://api:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  uploads: