[project]
name = "orcai-backend"
version = "0.1.0"
description = "ORCAI Ecosystem — dual-sided recruiting marketplace API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.43",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.7.0",
    "PyJWT>=2.10.1",
    "bcrypt>=4.3.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "email-validator>=2.2.0",
    "pypdf>=5.1.0",
    "python-docx>=1.2.0",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]